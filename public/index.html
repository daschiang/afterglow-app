<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>餘溫</title>
<meta name="description" content="把對話留下的溫度，好好收著。" />

<!-- PWA：讓手機瀏覽器可以「加到主畫面」，用起來像一般 App -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#17111C" />

<!-- iOS Safari 專用（Android/Chrome 讀 manifest.json 就夠了）-->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="餘溫" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #17111C; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
